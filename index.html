<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لنبصر معاً</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;direction:rtl}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

/* HEADER */
.header{background:linear-gradient(90deg,#0ea5e9,#6366f1);padding:5px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px #0ea5e966}
.header-title{font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.breadcrumb{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 12px;background:#1e293b;border-bottom:1px solid #334155}
.breadcrumb span{cursor:pointer;text-decoration:underline}
.breadcrumb span:hover{color:#fff}
.nav-btns{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.nav-btns::-webkit-scrollbar{display:none}
.nav-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:20px;padding:4px 10px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:600;font-size:11px;transition:.2s;white-space:nowrap;flex-shrink:0}
.nav-btn.active{background:rgba(255,255,255,0.35)}
.nav-btn:hover{background:rgba(255,255,255,0.25)}

/* VOL BAR */
.vol-bar{background:#1e293b;border-bottom:1px solid #334155;padding:7px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vol-bar input{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:5px 11px;font-family:'Tajawal',sans-serif;font-size:13px;flex:1;min-width:110px;max-width:200px}
.vol-bar input:focus{outline:2px solid #0ea5e9}
.vol-counter{font-size:11px;color:#60a5fa;background:#0ea5e922;border:1px solid #0ea5e944;border-radius:20px;padding:2px 10px;white-space:nowrap}
.online-badge{font-size:11px;color:#22c55e;background:#22c55e18;border:1px solid #22c55e33;border-radius:20px;padding:2px 9px;white-space:nowrap;margin-right:auto}
.new-alert{background:#f59e0b;color:#000;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;animation:pulse 1s infinite;display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* CONTENT */
.content{padding:14px 16px;max-width:1500px;margin:0 auto}

/* STATS BAR */
.stats-bar{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.stat-card{background:rgba(255,255,255,0.06);border-radius:9px;padding:8px 13px;text-align:center;min-width:78px;border:1px solid transparent}
.stat-card .val{font-size:21px;font-weight:800}
.stat-card .lbl{font-size:10px;color:#94a3b8;margin-top:1px}

/* TOOLBAR */
.toolbar{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:7px 10px;font-family:'Tajawal',sans-serif;font-size:13px}
.toolbar input{flex:1;min-width:150px}
.toolbar input:focus,.toolbar select:focus{outline:2px solid #0ea5e9}
.btn-primary{background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:13px;white-space:nowrap}
.btn-secondary{background:rgba(255,255,255,0.07);border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-green{background:#14532d;border:1px solid #16a34a55;color:#86efac;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600}
.btn-danger{background:#450a0a;border:1px solid #dc262655;color:#fca5a5;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}

/* EVENTS GRID */
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.event-card{background:rgba(255,255,255,0.05);border:1px solid #334155;border-radius:12px;padding:16px;cursor:pointer;transition:.2s;position:relative}
.event-card:hover{border-color:#0ea5e9;background:rgba(14,165,233,0.08);transform:translateY(-2px)}
.event-card .ev-icon{font-size:28px;margin-bottom:8px}
.event-card .ev-name{font-size:16px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.event-card .ev-date{font-size:12px;color:#64748b;margin-bottom:8px}
.event-card .ev-note{font-size:12px;color:#94a3b8;margin-bottom:10px;font-style:italic}
.event-card .ev-stats{display:flex;gap:8px;flex-wrap:wrap}
.ev-badge{background:rgba(255,255,255,0.07);border-radius:20px;padding:3px 10px;font-size:11px;color:#94a3b8}
.ev-badge b{color:#e2e8f0}
.event-card .ev-actions{position:absolute;top:10px;left:10px;display:flex;gap:4px;opacity:0;transition:.2s}
.event-card:hover .ev-actions{opacity:1}
.ev-act-btn{background:rgba(0,0,0,0.4);border:none;border-radius:5px;padding:3px 7px;cursor:pointer;font-size:11px}
.add-event-card{border:2px dashed #334155;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;color:#475569;font-size:14px}
.add-event-card:hover{border-color:#0ea5e9;color:#0ea5e9;background:rgba(14,165,233,0.05)}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #334155}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:rgba(14,165,233,0.15)}
th{padding:9px 8px;text-align:right;color:#7dd3fc;font-weight:700;white-space:nowrap;border-bottom:1px solid #334155}
tbody tr:nth-child(even){background:rgba(255,255,255,0.02)}
tbody tr:hover{background:rgba(14,165,233,0.07);cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid #1e293b;white-space:nowrap;vertical-align:middle}
.tfoot-info{padding:7px 2px;color:#475569;font-size:11px}

/* BADGE */
.badge{border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.act-btn{border:none;border-radius:5px;padding:3px 7px;cursor:pointer;font-size:11px;margin-left:3px}

/* ROW EXPAND */
.row-detail{background:#0f172a;border-bottom:2px solid #0ea5e922}
.row-detail td{padding:10px 14px}
.detail-grid{display:flex;flex-wrap:wrap;gap:8px}
.detail-item{background:#1e293b;border-radius:7px;padding:5px 11px;font-size:12px;border:1px solid #334155}
.detail-item .dk{color:#94a3b8;font-size:10px}
.detail-item .dv{color:#e2e8f0;font-weight:600;margin-top:1px}

/* PANEL */
.panel-overlay{position:fixed;inset:0;background:#000b;z-index:200;display:none;align-items:flex-start;justify-content:flex-end}
.panel-overlay.open{display:flex}
.panel{background:#1e293b;border-left:1px solid #334155;width:min(460px,100vw);height:100vh;overflow-y:auto;padding:18px;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:700;color:#60a5fa}
.close-btn{background:rgba(255,255,255,0.08);border:none;color:#94a3b8;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field.full{grid-column:span 2}
.field label{font-size:11px;color:#94a3b8;font-weight:600}
.field input,.field select,.field textarea{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:7px 9px;font-family:'Tajawal',sans-serif;font-size:13px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #0ea5e9;border-color:#0ea5e9}
.field textarea{resize:vertical;min-height:52px}
.panel-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-save{background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;border-radius:8px;padding:9px 22px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;flex:1}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel-p{background:rgba(255,255,255,0.07);border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:9px 14px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px}

/* EVENT PANEL */
.ev-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.ev-field label{font-size:12px;color:#94a3b8;font-weight:600}
.ev-field input,.ev-field select,.ev-field textarea{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:8px 10px;font-family:'Tajawal',sans-serif;font-size:14px;width:100%}
.ev-field input:focus,.ev-field textarea:focus{outline:2px solid #0ea5e9}
.ev-field textarea{resize:vertical;min-height:60px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stat-box{background:rgba(255,255,255,0.04);border:1px solid #334155;border-radius:12px;padding:14px}
.stat-box h3{font-size:12px;color:#7dd3fc;margin-bottom:11px;font-weight:700}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-row .bl{flex:1;font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-fill{height:6px;border-radius:3px;min-width:3px;transition:.5s}
.bar-row .bn{font-size:12px;font-weight:700;min-width:16px}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:#475569;border:1px dashed #334155;border-radius:12px}
.empty .icon{font-size:38px;margin-bottom:9px}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:#475569}
.spinner{width:20px;height:20px;border:3px solid #334155;border-top-color:#0ea5e9;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;border-radius:9px;padding:9px 18px;font-size:13px;z-index:999;box-shadow:0 4px 20px #000a;animation:fadeUp .3s ease;white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* EVENT BANNER */
.event-banner{background:linear-gradient(135deg,#1e3a5f,#2d1b69);border:1px solid #0ea5e944;border-radius:11px;padding:13px 16px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.event-banner .eb-name{font-size:16px;font-weight:800;color:#7dd3fc}
.event-banner .eb-date{font-size:12px;color:#64748b;margin-top:2px}
.event-banner .eb-note{font-size:12px;color:#94a3b8;margin-top:3px;font-style:italic}
.event-banner .eb-right{display:flex;gap:6px;align-items:center}

@media(max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:span 1}
  .stats-bar{gap:5px}
  .stat-card{min-width:68px;padding:6px 9px}
  .stat-card .val{font-size:18px}
  .events-grid{grid-template-columns:1fr}
  .content{padding:10px 10px}
  .toolbar{gap:6px}
  .panel{width:100vw}
  .event-banner{padding:10px 12px}
  .event-banner .eb-name{font-size:14px}
}

/* ── VOLUNTEERS ─────────────────────────────────────────────────── */
.vol-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.vol-card:hover{border-color:#6366f155;background:#1e293b}
.vol-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.vol-info{flex:1;min-width:0}
.vol-name{font-size:14px;font-weight:700;color:#e2e8f0}
.vol-meta{font-size:11px;color:#64748b;margin-top:2px}
.vol-badge-status{font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid}
.vol-badge-pending{color:#f59e0b;border-color:#f59e0b44;background:#f59e0b11}
.vol-badge-approved{color:#22c55e;border-color:#22c55e44;background:#22c55e11}
.vol-profile{padding:0}
.vp-header{background:linear-gradient(135deg,#1e3a5f,#2d1b69);padding:24px 16px;text-align:center;border-radius:0}
.vp-avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px}
.vp-name{font-size:20px;font-weight:800;color:#e2e8f0}
.vp-meta{font-size:12px;color:#94a3b8;margin-top:4px}
.vp-stats{display:flex;gap:8px;padding:12px 14px;background:#0f172a;flex-wrap:wrap}
.vp-stat{flex:1;min-width:80px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px;text-align:center}
.vp-stat .v{font-size:20px;font-weight:800;color:#60a5fa}
.vp-stat .l{font-size:10px;color:#64748b;margin-top:2px}
.vp-records{padding:12px 14px}
.vol-reg-box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;max-width:420px;margin:20px auto}
.vol-reg-box h3{font-size:16px;font-weight:800;margin-bottom:14px;color:#e2e8f0;text-align:center}
.reg-field{margin-bottom:12px}
.reg-field label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px}
.reg-field input, .reg-field select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-family:'Tajawal',sans-serif;font-size:13px;box-sizing:border-box}
.panel-overlay2{position:fixed;inset:0;background:#000a;z-index:300;display:none;align-items:flex-end;justify-content:center}
.panel-overlay2.open{display:flex}
.panel2{background:#0f172a;border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border-top:1px solid #334155}
.panel2-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0f172a;z-index:1}
.panel2-title{font-size:15px;font-weight:800;color:#e2e8f0}


/* ── ROLES & ACTIVITY ──────────────────────────────────────────────── */
.role-badge{font-size:10px;font-weight:700;border-radius:12px;padding:2px 8px;border:1px solid}
.role-supervisor{color:#f59e0b;border-color:#f59e0b55;background:#f59e0b11}
.role-volunteer{color:#22c55e;border-color:#22c55e55;background:#22c55e11}
.role-reader{color:#60a5fa;border-color:#60a5fa55;background:#60a5fa11}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-text{font-size:12px;color:#94a3b8;flex:1}
.activity-time{font-size:10px;color:#475569;white-space:nowrap}
/* ── CHAT ───────────────────────────────────────────────────────────── */
.chat-wrap{display:flex;flex-direction:column;height:320px}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5}
.chat-msg.mine{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;align-self:flex-start;border-radius:12px 12px 3px 12px}
.chat-msg.theirs{background:#1e293b;color:#e2e8f0;align-self:flex-end;border-radius:12px 12px 12px 3px;border:1px solid #334155}
.chat-msg .msg-meta{font-size:10px;opacity:.7;margin-bottom:3px}
.chat-input-row{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #1e293b;background:#0f172a}
.chat-input-row input{flex:1;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:20px;padding:7px 13px;font-family:'Tajawal',sans-serif;font-size:13px}
.chat-send-btn{background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;flex-shrink:0}
/* ── NOTES ──────────────────────────────────────────────────────────── */
.note-item{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.note-item .note-author{font-size:11px;font-weight:700;color:#7dd3fc}
.note-item .note-time{font-size:10px;color:#475569}
.note-item .note-text{font-size:13px;color:#e2e8f0;margin-top:4px}
.tab-btns{display:flex;gap:6px;margin-bottom:12px}
.tab-btn{flex:1;padding:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:600;transition:.2s}
.tab-btn.active{background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff;border-color:transparent}

</style>
</head>
<body>

<!-- HEADER -->

  <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
</div>

<!-- PANEL: Add/Edit Record -->
<div class="panel-overlay" id="recPanelOverlay" onclick="overlayClick(event,'recPanelOverlay')">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="recPanelTitle">➕ إضافة مستفيد</div>
      <button class="close-btn" onclick="closeRecPanel()">✕</button>
    </div>
    <div class="form-grid">
      <div class="field full"><label>الاسم الكامل *</label><input type="text" id="f-name" placeholder="اسم المستفيد"/></div>
      <div class="field"><label>الجنس</label><select id="f-gender"><option>أنثى</option><option>ذكر</option></select></div>
      <div class="field"><label>العمر *</label><input type="number" id="f-age" placeholder="السنوات" min="1" max="120"/></div>
      <div class="field"><label>PMH</label>
        <select id="f-pmh"><option>Healthy</option><option>1-DM</option><option>Cardiac diseases</option><option>Others</option></select></div>
      <div class="field"><label>POH</label>
        <select id="f-poh"><option>Healthy</option><option>Refractive Error</option><option>Others</option></select></div>
      <div class="field"><label>VA — RE (يمنى)</label>
        <select id="f-va-re"><option>—</option><option>20/20</option><option>20/25</option><option>20/30</option><option>20/40</option><option>20/50</option><option>20/70</option><option>20/80</option><option>20/100</option><option>20/200</option></select></div>
      <div class="field"><label>VA — LE (يسرى)</label>
        <select id="f-va-le"><option>—</option><option>20/20</option><option>20/25</option><option>20/30</option><option>20/40</option><option>20/50</option><option>20/70</option><option>20/80</option><option>20/100</option><option>20/200</option></select></div>
      <div class="field"><label>OBJ Diagnosis</label>
        <select id="f-obj"><option>—</option><option>Healthy</option><option>Refractive Error</option><option>Myopia</option><option>Hyperopia</option><option>Compound Myopic astigmatism</option><option>Compound Hyperopic astigmatism</option><option>Simple hyperoic astigmatism</option><option>Others</option></select></div>
      <div class="field"><label>CT — الحول</label>
        <select id="f-ct"><option>—</option><option>NAD</option><option>Phoria</option><option>Esotropia</option><option>Exotropia</option></select></div>
      <div class="field"><label>CV — الألوان</label>
        <select id="f-cv"><option>—</option><option>Pass</option><option>fail</option></select></div>
      <div class="field"><label>Motility — العضلات</label>
        <select id="f-motility"><option>—</option><option>Pass</option><option>fail</option></select></div>
      <div class="field"><label>External Observation</label>
        <select id="f-ext"><option>—</option><option>NAD</option><option>Abnormal</option></select></div>
      <div class="field"><label>التحويل</label>
        <select id="f-ref"><option>—</option><option>Pass</option><option>Feferral</option></select></div>
      <div class="field full"><label>سبب التحويل</label>
        <input type="text" id="f-ref-reason" placeholder="اختياري"/></div>
      <div class="field full"><label>ملاحظات</label>
        <textarea id="f-note" placeholder="ملاحظات إضافية"></textarea></div>
    </div>
    <div class="panel-actions">
      <button class="btn-save" id="recSaveBtn" onclick="saveRecord()">💾 حفظ</button>
      <button class="btn-cancel-p" onclick="closeRecPanel()">إلغاء</button>
    </div>
  </div>
</div>

<!-- PANEL: Add/Edit Event -->
<div class="panel-overlay" id="evPanelOverlay" onclick="overlayClick(event,'evPanelOverlay')">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="evPanelTitle">➕ إضافة فعالية جديدة</div>
      <button class="close-btn" onclick="closeEvPanel()">✕</button>
    </div>
    <div class="ev-field">
      <label>🏫 اسم المكان / المدرسة *</label>
      <input type="text" id="ev-name" placeholder="مثال: مدرسة الأمل الابتدائية"/>
    </div>
    <div class="ev-field">
      <label>📅 التاريخ</label>
      <input type="date" id="ev-date"/>
    </div>
    <div class="ev-field">
      <label>📍 الموقع / العنوان</label>
      <input type="text" id="ev-location" placeholder="اختياري"/>
    </div>
    <div class="ev-field">
      <label>📝 ملاحظات</label>
      <textarea id="ev-note" placeholder="وصف الفعالية أو أي ملاحظات إضافية"></textarea>
    </div>
    <div class="panel-actions">
      <button class="btn-save" id="evSaveBtn" onclick="saveEvent()">💾 حفظ الفعالية</button>
      <button class="btn-cancel-p" onclick="closeEvPanel()">إلغاء</button>
    </div>
  </div>
</div>

<script>
// ── Firebase ──────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyCOWU60uZYt47d8Sgv7h0c6Z08t6vj8bPE",
  authDomain: "screening-schools.firebaseapp.com",
  databaseURL: "https://screening-schools-default-rtdb.firebaseio.com",
  projectId: "screening-schools",
  storageBucket: "screening-schools.firebasestorage.app",
  messagingSenderId: "60555044048",
  appId: "1:60555044048:web:9eeeb694ac52b46b95b4d5"
});
const db = firebase.database();
const eventsRef = db.ref('events');
const recordsRef = db.ref('records');
const volsRef = db.ref('volunteers');
const activityRef = db.ref('activity');
const chatRef = db.ref('chat');
const notesRef = db.ref('notes');

// ── State ─────────────────────────────────────────────────────────────
let events = {};
let records = {};
let volunteers = {};
let activityLog = {};
let chatMessages = {};
let eventNotes = {};
let currentChatEventId = null;
let volName = localStorage.getItem('vol_name') || '';
let currentView = 'home'; // home | event | all | stats
let currentEventId = null;
let editRecId = null;
let editEvId = null;
let expandedId = null;

// ── Init ──────────────────────────────────────────────────────────────
document.getElementById('volName').value = volName;

// Real-time listeners
eventsRef.on('value', snap => {
  events = snap.val() || {};
  if (currentView === 'home') renderHome();
  if (currentView === 'stats') renderGlobalStats();
  updateBreadcrumb();
});

recordsRef.on('value', snap => {
  const prev = Object.keys(records).length;
  records = snap.val() || {};
  const curr = Object.keys(records).length;
  if (prev > 0 && curr > prev) showNewAlert();
  updateMyCount();
  if (currentView === 'event') renderEventView();
  if (currentView === 'all') renderAllView();
  if (currentView === 'stats') renderGlobalStats();
  document.getElementById('onlineBadge').textContent = '🟢 ' + new Date().toLocaleTimeString('ar');
}, () => {
  document.getElementById('onlineBadge').textContent = '🔴 انقطع الاتصال';
  document.getElementById('onlineBadge').style.color = '#f87171';
});

volsRef.on('value', snap => {
  volunteers = snap.val() || {};
  if (currentView === 'volunteers') renderVolunteers();
});
activityRef.limitToLast(50).on('value', snap => {
  activityLog = snap.val() || {};
});
chatRef.on('value', snap => {
  chatMessages = snap.val() || {};
  if (currentChatEventId) renderChatMessages(currentChatEventId);
});
notesRef.on('value', snap => {
  eventNotes = snap.val() || {};
});

// ── Vol ───────────────────────────────────────────────────────────────
function saveVolName() {
  volName = document.getElementById('volName').value.trim();
  localStorage.setItem('vol_name', volName);
  updateMyCount();
}
function updateMyCount() {
  const n = Object.values(records).filter(r => r.addedBy === volName && volName).length;
  document.getElementById('myCount').textContent = `سجلاتي: ${n}`;
}

// ── Navigation ────────────────────────────────────────────────────────
function setActiveNav(id) {
  ['nb-main','nb-all','nb-stats','nb-vols'].forEach(n => document.getElementById(n).classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

function goHome() {
  currentView = 'home';
  currentEventId = null;
  expandedId = null;
  statsFilterEventId = '';
  setActiveNav('nb-main');
  updateBreadcrumb();
  renderHome();
}

function showAllRecords() {
  currentView = 'all';
  currentEventId = null;
  expandedId = null;
  setActiveNav('nb-all');
  updateBreadcrumb();
  renderAllView();
}

function showGlobalStats() {
  currentView = 'stats';
  setActiveNav('nb-stats');
  updateBreadcrumb();
  renderGlobalStats();
}

function openEvent(evId) {
  currentView = 'event';
  currentEventId = evId;
  expandedId = null;
  setActiveNav(null);
  updateBreadcrumb();
  renderEventView();
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (currentView === 'home' || !currentView) { bc.innerHTML = ''; return; }
  if (currentView === 'all') { bc.innerHTML = `<span onclick="goHome()">🏠 الفعاليات</span> ← كل المستفيدين`; return; }
  if (currentView === 'stats') { bc.innerHTML = `<span onclick="goHome()">🏠 الفعاليات</span> ← الإحصائيات`; return; }
  if (currentView === 'volunteers') { bc.innerHTML = `<span onclick="goHome()">🏠 الفعاليات</span> ← المتطوعون`; return; }
  if (currentView === 'event' && currentEventId && events[currentEventId]) {
    bc.innerHTML = `<span onclick="goHome()">🏠 الفعاليات</span> ← ${events[currentEventId].name}`;
  }
}

// ── HOME — Events Grid ────────────────────────────────────────────────
function renderHome() {
  const evArr = Object.entries(events).sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));
  const totalRecs = Object.keys(records).length;
  const totalRef = Object.values(records).filter(r=>r.referral==='Feferral').length;
  const totalVols = new Set(Object.values(records).map(r=>r.addedBy).filter(Boolean)).size;

  let html = `
    <div class="stats-bar">
      <div class="stat-card" style="border-color:#6366f144"><div class="val" style="color:#818cf8">${evArr.length}</div><div class="lbl">فعاليات</div></div>
      <div class="stat-card" style="border-color:#60a5fa44"><div class="val" style="color:#60a5fa">${totalRecs}</div><div class="lbl">إجمالي المستفيدين</div></div>
      <div class="stat-card" style="border-color:#f59e0b44"><div class="val" style="color:#f59e0b">${totalRef}</div><div class="lbl">تحويل</div></div>
      <div class="stat-card" style="border-color:#34d39944"><div class="val" style="color:#34d399">${totalVols}</div><div class="lbl">متطوعون</div></div>
    </div>
    <div class="events-grid">`;

  for (const [id, ev] of evArr) {
    const evRecs = Object.values(records).filter(r => r.eventId === id);
    const evRef = evRecs.filter(r=>r.referral==='Feferral').length;
    const incomplete = evRecs.filter(r=>!isComplete(r)).length;
    const dateStr = ev.date ? new Date(ev.date+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'}) : '';
    html += `
      <div class="event-card" onclick="openEvent('${id}')">
        <div class="ev-actions" onclick="event.stopPropagation()">
          <button class="ev-act-btn" style="color:#60a5fa" onclick="openEvPanel('${id}')">✏️</button>
          <button class="ev-act-btn" style="color:#a78bfa" onclick="openEventChat('${id}')">💬</button>
          <button class="ev-act-btn" style="color:#f87171" onclick="deleteEvent('${id}')">🗑️</button>
        </div>
        <div class="ev-icon">🏫</div>
        <div class="ev-name">${ev.name}</div>
        ${dateStr ? `<div class="ev-date">📅 ${dateStr}</div>` : ''}
        ${ev.location ? `<div class="ev-date">📍 ${ev.location}</div>` : ''}
        ${ev.note ? `<div class="ev-note">${ev.note}</div>` : ''}
        <div class="ev-stats">
          <span class="ev-badge">👥 <b>${evRecs.length}</b> مستفيد</span>
          ${evRef ? `<span class="ev-badge" style="color:#f59e0b">🔀 <b>${evRef}</b> تحويل</span>` : ''}
          ${incomplete ? `<span class="ev-badge" style="color:#f59e0b">⏳ <b>${incomplete}</b> ناقص</span>` : ''}
          ${!incomplete && evRecs.length ? `<span class="ev-badge" style="color:#22c55e">✅ مكتملة</span>` : ''}
        </div>
      </div>`;
  }

  html += `
      <div class="event-card add-event-card" onclick="openEvPanel()">
        <span style="font-size:32px">➕</span>
        <span>إضافة فعالية جديدة</span>
      </div>
    </div>`;

  document.getElementById('mainContent').innerHTML = html;
}

// ── EVENT VIEW ────────────────────────────────────────────────────────
function renderEventView() {
  if (!currentEventId || !events[currentEventId]) { goHome(); return; }
  const ev = events[currentEventId];
  const evRecs = Object.entries(records)
    .filter(([,r]) => r.eventId === currentEventId)
    .map(([id,r]) => ({...r,id}))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  const totalRef = evRecs.filter(r=>r.referral==='Feferral').length;
  const incomplete = evRecs.filter(r=>!isComplete(r)).length;
  const dateStr = ev.date ? new Date(ev.date+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'}) : '';

  let html = `
    <div class="event-banner">
      <div>
        <div class="eb-name">🏫 ${ev.name}</div>
        ${dateStr ? `<div class="eb-date">📅 ${dateStr}${ev.location ? ' &nbsp;|&nbsp; 📍 '+ev.location : ''}</div>` : (ev.location ? `<div class="eb-date">📍 ${ev.location}</div>` : '')}
        ${ev.note ? `<div class="eb-note">${ev.note}</div>` : ''}
      </div>
      <div class="eb-right">
        <span class="ev-badge">👥 <b>${evRecs.length}</b> مستفيد</span>
        ${totalRef ? `<span class="ev-badge" style="color:#f59e0b">🔀 <b>${totalRef}</b> تحويل</span>` : ''}
        ${incomplete ? `<span class="ev-badge" style="color:#f59e0b">⏳ <b>${incomplete}</b> ناقص</span>` : ''}
      </div>
    </div>
    <div class="toolbar">
      <input type="text" id="evSearch" placeholder="🔍 بحث..." oninput="renderEventView()"/>
      <select id="evFilterRef" onchange="renderEventView()">
        <option value="">التحويل: الكل</option>
        <option value="Feferral">تحويل فقط</option>
        <option value="Pass">Pass فقط</option>
      </select>
      <select id="evFilterComplete" onchange="renderEventView()">
        <option value="">الكل</option>
        <option value="incomplete">غير مكتملة</option>
        <option value="complete">مكتملة</option>
      </select>
      <button class="btn-primary" onclick="openRecPanel()">➕ إضافة مستفيد</button>
      <button class="btn-green" onclick="exportCSV('${currentEventId}')">⬇️ CSV</button>
    </div>`;

  html += renderRecordsTable(evRecs, true);
  document.getElementById('mainContent').innerHTML = html;
}

// ── ALL RECORDS VIEW ──────────────────────────────────────────────────
function renderAllView() {
  const allRecs = Object.entries(records)
    .map(([id,r]) => ({...r,id}))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  const totalRef = allRecs.filter(r=>r.referral==='Feferral').length;
  const incomplete = allRecs.filter(r=>!isComplete(r)).length;

  let html = `
    <div class="stats-bar">
      <div class="stat-card" style="border-color:#60a5fa44"><div class="val" style="color:#60a5fa">${allRecs.length}</div><div class="lbl">إجمالي المستفيدين</div></div>
      <div class="stat-card" style="border-color:#f59e0b44"><div class="val" style="color:#f59e0b">${totalRef}</div><div class="lbl">تحويل</div></div>
      <div class="stat-card" style="border-color:#34d39944"><div class="val" style="color:#34d399">${allRecs.filter(r=>r.gender==='ذكر').length}</div><div class="lbl">ذكور</div></div>
      <div class="stat-card" style="border-color:#f472b644"><div class="val" style="color:#f472b6">${allRecs.filter(r=>r.gender==='أنثى').length}</div><div class="lbl">إناث</div></div>
      <div class="stat-card" style="border-color:#a78bfa44"><div class="val" style="color:#a78bfa">${allRecs.filter(r=>r.pmh==='1-DM').length}</div><div class="lbl">سكري</div></div>
    </div>
    <div class="toolbar">
      <input type="text" id="allSearch" placeholder="🔍 بحث بالاسم أو الفعالية..." oninput="renderAllView()"/>
      <select id="allFilterGender" onchange="renderAllView()">
        <option value="">الجنس: الكل</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
      <select id="allFilterRef" onchange="renderAllView()">
        <option value="">التحويل: الكل</option>
        <option value="Feferral">تحويل فقط</option>
        <option value="Pass">Pass فقط</option>
      </select>
      <select id="allFilterEvent" onchange="renderAllView()">
        <option value="">الفعالية: الكل</option>
        ${Object.entries(events).map(([id,ev])=>`<option value="${id}">${ev.name}</option>`).join('')}
      </select>
      <button class="btn-green" onclick="exportCSV(null)">⬇️ CSV كامل</button>
    </div>`;

  // apply filters
  const s = (document.getElementById('allSearch')?.value||'').toLowerCase();
  const fg = document.getElementById('allFilterGender')?.value||'';
  const fr = document.getElementById('allFilterRef')?.value||'';
  const fe = document.getElementById('allFilterEvent')?.value||'';
  let filtered = allRecs.filter(r => {
    const evName = (r.eventId && events[r.eventId]) ? events[r.eventId].name : '';
    return (!s || (r.name||'').toLowerCase().includes(s) || evName.toLowerCase().includes(s) || (r.addedBy||'').toLowerCase().includes(s))
      && (!fg || r.gender===fg)
      && (!fr || r.referral===fr)
      && (!fe || r.eventId===fe);
  });

  html += renderRecordsTable(filtered, false, true);
  document.getElementById('mainContent').innerHTML = html;
}

// ── Records Table (shared) ────────────────────────────────────────────
function renderRecordsTable(arr, inEvent=false, showEventCol=false) {
  // apply local filters for event view
  if (inEvent) {
    const s = (document.getElementById('evSearch')?.value||'').toLowerCase();
    const fr = document.getElementById('evFilterRef')?.value||'';
    const fc = document.getElementById('evFilterComplete')?.value||'';
    arr = arr.filter(r =>
      (!s || (r.name||'').toLowerCase().includes(s) || (r.addedBy||'').toLowerCase().includes(s))
      && (!fr || r.referral===fr)
      && (!fc || (fc==='complete' ? isComplete(r) : !isComplete(r)))
    );
  }

  if (!arr.length) return `<div class="empty"><div class="icon">📋</div><div style="font-size:15px">لا توجد سجلات</div>${inEvent ? '<div style="font-size:12px;margin-top:5px;color:#64748b">اضغط "إضافة مستفيد" للبدء</div>' : ''}</div>`;

  const evColHdr = showEventCol ? '<th>الفعالية</th>' : '';
  let html = `<div class="table-wrap"><table><thead><tr>
    <th></th><th>الاسم</th><th>الجنس</th><th>العمر</th>
    ${evColHdr}
    <th>الاكتمال</th><th>VA RE</th><th>VA LE</th><th>OBJ</th><th>CT</th><th>CV</th><th>Motility</th><th>التحويل</th><th>بواسطة</th><th></th>
  </tr></thead><tbody>`;

  for (const r of arr) {
    const gc = r.gender==='ذكر' ? '#60a5fa' : '#f472b6';
    const complete = isComplete(r);
    const comp = complete ? `<span style="color:#22c55e;font-size:11px">✅</span>` : `<span style="color:#f59e0b;font-size:11px">⏳</span>`;
    const exp = expandedId === r.id;
    const evName = (r.eventId && events[r.eventId]) ? events[r.eventId].name : '—';
    const evColCell = showEventCol ? `<td style="color:#818cf8;font-size:11px;cursor:pointer" onclick="event.stopPropagation();openEvent('${r.eventId}')">${evName}</td>` : '';

    html += `<tr onclick="toggleExpand('${r.id}')" style="${!complete?'border-right:3px solid #f59e0b55':''}">
      <td style="color:#475569;font-size:10px">${exp?'▲':'▼'}</td>
      <td style="font-weight:700;color:#e2e8f0;min-width:100px">${r.name||'—'}</td>
      <td style="color:${gc}">${r.gender||'—'}</td>
      <td style="color:#94a3b8">${r.age||'—'}</td>
      ${evColCell}
      <td>${comp}</td>
      <td style="font-family:monospace;color:#a5f3fc">${r.va_re||'—'}</td>
      <td style="font-family:monospace;color:#a5f3fc">${r.va_le||'—'}</td>
      <td>${badge(r.obj)}</td><td>${badge(r.ct)}</td>
      <td>${badge(r.cv)}</td><td>${badge(r.motility)}</td>
      <td>${badge(r.referral)}</td>
      <td style="color:#7dd3fc;font-size:11px">${r.addedBy||'—'}</td>
      <td onclick="event.stopPropagation()">
        <button class="act-btn" style="background:#1e3a5f;color:#60a5fa" onclick="openRecPanel('${r.id}')">✏️</button>
        <button class="act-btn" style="background:#3f1f1f;color:#f87171" onclick="deleteRecord('${r.id}')">🗑️</button>
      </td>
    </tr>`;

    if (exp) {
      html += `<tr class="row-detail"><td colspan="20"><div class="detail-grid">
        <div class="detail-item"><div class="dk">PMH</div><div class="dv">${r.pmh||'—'}</div></div>
        <div class="detail-item"><div class="dk">POH</div><div class="dv">${r.poh||'—'}</div></div>
        <div class="detail-item"><div class="dk">External</div><div class="dv">${r.ext||'—'}</div></div>
        <div class="detail-item"><div class="dk">سبب التحويل</div><div class="dv">${r.ref_reason||'—'}</div></div>
        <div class="detail-item"><div class="dk">ملاحظات</div><div class="dv">${r.note||'—'}</div></div>
        <div class="detail-item"><div class="dk">أضيف بواسطة</div><div class="dv">${r.addedBy||'—'}</div></div>
        ${r.lastEditedBy && r.lastEditedBy!==r.addedBy ? `<div class="detail-item"><div class="dk">آخر تعديل</div><div class="dv" style="color:#f59e0b">${r.lastEditedBy}</div></div>` : ''}
        <div class="detail-item"><div class="dk">التاريخ</div><div class="dv">${r.createdAt ? new Date(r.createdAt).toLocaleString('ar') : '—'}</div></div>
      </div></td></tr>`;
    }
  }
  html += `</tbody></table></div><div class="tfoot-info">${arr.length} سجل — غير مكتملة: ${arr.filter(r=>!isComplete(r)).length}</div>`;
  return html;
}

function setStatsFilter(evId) {
  statsFilterEventId = evId;

function barRow(label, count, total, color) {
  const pct = Math.max(3, count/total*130);
  return `<div class="bar-row"><span class="bl" title="${label}">${label}</span><div class="bar-fill" style="width:${pct}px;background:${color}"></div><span class="bn" style="color:${color}">${count}</span></div>`;
}

function isComplete(r) {
  return r.va_re&&r.va_re!=='—'&&r.va_le&&r.va_le!=='—'&&r.obj&&r.obj!=='—'
    &&r.ct&&r.ct!=='—'&&r.cv&&r.cv!=='—'&&r.motility&&r.motility!=='—'&&r.referral&&r.referral!=='—';
}

const BC={Pass:'#22c55e',Feferral:'#f59e0b',fail:'#ef4444',NAD:'#60a5fa',
  Phoria:'#a78bfa',Esotropia:'#fb923c',Exotropia:'#f472b6',Healthy:'#34d399',Myopia:'#38bdf8',Hyperopia:'#818cf8'};
function badge(text) {
  if (!text||text==='—') return `<span style="color:#334155">—</span>`;
  const c=BC[text]||'#94a3b8';
  return `<span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}55">${text}</span>`;
}

let toastT;
function toast(msg,color='#60a5fa') {
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='toast'; el.style.borderColor=color+'66'; el.style.color=color; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3000);
}

function exportCSV(eventId) {
  let arr = Object.values(records);
  if (eventId) arr = arr.filter(r=>r.eventId===eventId);
  if (!arr.length) { toast('لا توجد سجلات','#f59e0b'); return; }
  const headers=['الاسم','الجنس','العمر','الفعالية','PMH','POH','VA RE','VA LE','OBJ','CT','CV','Motility','External','التحويل','سبب التحويل','ملاحظات','أضيف بواسطة','آخر تعديل','التاريخ'];
  const rows=arr.map(r=>[r.name,r.gender,r.age,
    (r.eventId&&events[r.eventId])?events[r.eventId].name:'',
    r.pmh,r.poh,r.va_re,r.va_le,r.obj,r.ct,r.cv,r.motility,r.ext,r.referral,r.ref_reason||'',r.note||'',r.addedBy||'',r.lastEditedBy||'',
    r.createdAt?new Date(r.createdAt).toLocaleDateString('ar'):''
  ]);
  const csv='\uFEFF'+[headers,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`eye_${eventId?events[eventId]?.name:'all'}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('✅ تم التصدير','#22c55e');
}

  } else {
    html += `<div class="vol-reg-box">
      <h3>🙋 سجّل كمتطوع</h3>
      <div class="reg-field"><label>الاسم الكامل *</label><input type="text" id="reg-name" placeholder="اسمك الثلاثي" maxlength="60"/></div>
      <div class="reg-field"><label>رقم الجوال *</label><input type="tel" id="reg-phone" placeholder="05xxxxxxxx" maxlength="15"/></div>
      <div class="reg-field"><label>سنة التطوع</label>
        <select id="reg-year">
          ${[2026,2025,2024,2023,2022,2021,2020].map(y=>`<option value="${y}">${y}</option>`).join('')}
        </select>
      </div>
      <button onclick="registerVol()" style="width:100%;background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;border-radius:10px;padding:10px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px">
        📩 إرسال طلب التسجيل
      </button>
    </div>`;
  }

  // Supervisor section - pending approvals
  if (isSupervisor && pending.length > 0) {
    html += `<div style="margin-bottom:8px">
      <div style="font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:8px">⏳ طلبات بانتظار الموافقة (${pending.length})</div>`;
    for (const [id,v] of pending) {
      html += `<div class="vol-card" style="margin-bottom:6px;border-color:#f59e0b33" onclick="openVolProfile('${id}')">
        <div class="vol-avatar" style="background:linear-gradient(135deg,#92400e,#d97706)">⏳</div>
        <div class="vol-info">
          <div class="vol-name">${v.name}</div>
          <div class="vol-meta">📱 ${v.phone||'—'} · 📅 ${v.year||'—'}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px" onclick="event.stopPropagation()">
          <button onclick="approveVol('${id}')" style="font-family:'Tajawal',sans-serif;font-size:11px;background:#22c55e22;color:#22c55e;border:1px solid #22c55e44;border-radius:6px;padding:4px 10px;cursor:pointer">✅ قبول</button>
          <button onclick="rejectVol('${id}')" style="font-family:'Tajawal',sans-serif;font-size:11px;background:#ef444422;color:#f87171;border:1px solid #ef444444;border-radius:6px;padding:4px 10px;cursor:pointer">❌ رفض</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // Approved volunteers
  if (approved.length > 0) {
    html += `<div style="font-size:12px;font-weight:700;color:#22c55e;margin-bottom:8px">✅ المتطوعون المعتمدون (${approved.length})</div>`;
    for (const [id,v] of approved) {
      const vRecs = Object.values(records).filter(r=>r.addedBy===v.name).length;
      html += `<div class="vol-card" style="margin-bottom:6px" onclick="openVolProfile('${id}')">
        <div class="vol-avatar">👤</div>
        <div class="vol-info">
          <div class="vol-name">${v.name}</div>
          <div class="vol-meta">📱 ${v.phone||'—'} · 📅 ${v.year||'—'} · 📋 ${vRecs} سجل</div>
        </div>
        <span class="vol-badge-status vol-badge-approved">✅ معتمد</span>
      </div>`;
    }
  }

  if (!approved.length && !pending.length && myVol) {
    html += `<div style="text-align:center;color:#475569;padding:30px;font-size:13px">لا يوجد متطوعون آخرون بعد</div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
}

async function registerVol() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const year = document.getElementById('reg-year').value;
  if (!name) { toast('أدخل اسمك الكامل','#f59e0b'); return; }
  if (!phone) { toast('أدخل رقم الجوال','#f59e0b'); return; }
  const existing = Object.entries(volunteers).find(([,v])=>v.phone===phone||v.name===name);
  if (existing) { toast('هذا الاسم أو الجوال مسجل مسبقاً','#f59e0b'); return; }
  const ref = await volsRef.push({ name, phone, year, role:'volunteer', status:'pending', createdAt: Date.now() });
  localStorage.setItem('my_vol_id', ref.key);
  // Update vol name bar
  volName = name;
  localStorage.setItem('vol_name', name);
  document.getElementById('volName').value = name;
  toast('✅ تم إرسال طلبك، انتظر موافقة المشرف','#22c55e');
  renderVolunteers();
}

async function approveVol(id) {
  await volsRef.child(id).update({ status:'approved', approvedAt: Date.now() });
  toast('✅ تم قبول المتطوع','#22c55e');
}

async function rejectVol(id) {
  if (!confirm('حذف طلب هذا المتطوع؟')) return;
  await volsRef.child(id).remove();
  toast('🗑️ تم رفض الطلب','#f87171');
}

  let html = `<div class="panel2-header">
    <div class="panel2-title">👤 ملف المتطوع</div>
    <button class="close-btn" onclick="closeVolPanel()">✕</button>
  </div>
  <div class="vp-header">
    <div class="vp-avatar">👤</div>
    <div class="vp-name">${v.name}</div>
    <div class="vp-meta">📱 ${v.phone||'—'} · 📅 سنة ${v.year||'—'}</div>
    <div style="margin-top:8px;display:flex;gap:6px;justify-content:center">
      <span class="vol-badge-status ${v.status==='approved'?'vol-badge-approved':'vol-badge-pending'}">${v.status==='approved'?'✅ معتمد':'⏳ قيد الانتظار'}</span>
      ${v.role?`<span class="role-badge ${roleClass(v.role)}">${roleName(v.role)}</span>`:''}

  <div class="vp-stats">
    <div class="vp-stat"><div class="v">${vRecs.length}</div><div class="l">سجل</div></div>
    <div class="vp-stat"><div class="v" style="color:#f59e0b">${vRefs}</div><div class="l">تحويل</div></div>
    <div class="vp-stat"><div class="v" style="color:#34d399">${vRecs.filter(([,r])=>r.gender==='ذكر').length}</div><div class="l">ذكور</div></div>
    <div class="vp-stat"><div class="v" style="color:#f472b6">${vRecs.filter(([,r])=>r.gender==='أنثى').length}</div><div class="l">إناث</div></div>
  </div>`;

  if (isSupervisor && !isMe) {
    html += `<div style="padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #1e293b">
      <button onclick="openRoleManager('${id}')" style="flex:1;font-family:'Tajawal',sans-serif;font-size:12px;background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b44;border-radius:8px;padding:7px;cursor:pointer">🛡️ تغيير الصلاحية</button>
    </div>`;
  }
  if (isMe) {
    html += `<div style="padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #1e293b">`;
      <button onclick="openEditVol('${id}')" style="flex:1;font-family:'Tajawal',sans-serif;font-size:12px;background:#6366f122;color:#a5b4fc;border:1px solid #6366f144;border-radius:8px;padding:7px;cursor:pointer">✏️ تعديل بياناتي</button>
      <button onclick="deleteMyVol('${id}')" style="flex:1;font-family:'Tajawal',sans-serif;font-size:12px;background:#ef444422;color:#f87171;border:1px solid #ef444444;border-radius:8px;padding:7px;cursor:pointer">🗑️ حذف حسابي</button>
    </div>`;
  }

  html += `<div class="vp-records"><div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:10px">📋 آخر السجلات</div>`;
  if (!vRecs.length) {
    html += `<div style="color:#475569;font-size:12px;text-align:center;padding:20px">لا توجد سجلات بعد</div>`;
  } else {
    const sorted = vRecs.sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).slice(0,10);
    for (const [rid,r] of sorted) {
      const evName = r.eventId && events[r.eventId] ? events[r.eventId].name : '—';
      html += `<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#e2e8f0">${r.name||'—'}</div>
          <div style="font-size:11px;color:#64748b">🏫 ${evName} · ${r.createdAt?new Date(r.createdAt).toLocaleDateString('ar-SA'):''}</div>
        </div>
        ${r.referral==='Feferral'?'<span style="font-size:10px;background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44;border-radius:10px;padding:2px 7px">تحويل</span>':''}
      </div>`;

  html += `</div>`;

  document.getElementById('volPanelContent').innerHTML = html;

      <button class="close-btn" onclick="closeVolPanel()">✕</button>

function loginSupervisor() {
  const phone = document.getElementById('sup-phone').value.trim();

  if (phone === ADMIN_PHONE && pass === ADMIN_PASS) {

    renderVolunteers();

    toast('❌ رقم الجوال أو كلمة السر غلط', '#f87171');

function logoutSupervisor() {

  localStorage.removeItem('is_supervisor');
  toast('تم تسجيل الخروج', '#94a3b8');
  renderVolunteers();
}


// ── ROLE HELPERS ──────────────────────────────────────────────────────
function getMyRole() {
  if (isSupervisor) return 'supervisor';
  const myVolId = localStorage.getItem('my_vol_id');
  const myVol = myVolId && volunteers[myVolId];
  if (!myVol || myVol.status !== 'approved') return 'reader';
  return myVol.role || 'volunteer';
}

function canEdit() {
  return isSupervisor || getMyRole() === 'volunteer';
}

function roleName(role) {
  return role === 'supervisor' ? '🔐 مشرف' : role === 'reader' ? '👁️ قارئ' : '✅ متطوع';
}

function roleClass(role) {
  return role === 'supervisor' ? 'role-supervisor' : role === 'reader' ? 'role-reader' : 'role-volunteer';
}

// ── ACTIVITY LOG ──────────────────────────────────────────────────────
async function logActivity(action, detail, color) {
  await activityRef.push({
    who: volName || 'مجهول',
    action, detail, color,
    ts: Date.now()
  });
}

function showActivityLog() {
  const items = Object.values(activityLog).sort((a,b)=>b.ts-a.ts).slice(0,40);
  const html = items.length ? items.map(i => {
    const t = new Date(i.ts);
    const timeStr = t.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}) + ' ' + t.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
    return `<div class="activity-item">
      <div class="activity-dot" style="background:${i.color||'#60a5fa'}"></div>
      <div class="activity-text"><b>${i.who}</b> ${i.action} <span style="color:#e2e8f0">${i.detail||''}</span></div>
      <div class="activity-time">${timeStr}</div>
    </div>`;
  }).join('') : '<div style="color:#475569;text-align:center;padding:20px;font-size:12px">لا يوجد نشاط بعد</div>';

  document.getElementById('volPanelContent').innerHTML = `
    <div class="panel2-header">
      <div class="panel2-title">📋 سجل النشاط</div>
      <button class="close-btn" onclick="closeVolPanel()">✕</button>
    </div>
    <div style="padding:12px 14px">${html}</div>`;
  document.getElementById('volPanelOverlay').classList.add('open');
}

// ── CHAT & NOTES ──────────────────────────────────────────────────────
function openEventChat(evId) {
  currentChatEventId = evId;
  const ev = events[evId] || {};
  let activeTab = 'chat';

  function render(tab) {
    activeTab = tab;
    const msgs = Object.values(chatMessages).filter(m=>m.eventId===evId).sort((a,b)=>a.ts-b.ts);
    const notes = Object.values(eventNotes).filter(n=>n.eventId===evId).sort((a,b)=>b.ts-a.ts);

    let inner = `<div class="panel2-header">
      <div class="panel2-title">💬 ${ev.name||''}</div>
      <button class="close-btn" onclick="closeVolPanel()">✕</button>
    </div>
    <div style="padding:10px 12px 0">
      <div class="tab-btns">
        <button class="tab-btn ${tab==='chat'?'active':''}" onclick="openEventChat('${evId}');document.querySelectorAll('.tab-btn')[0].click()">💬 دردشة</button>
        <button class="tab-btn ${tab==='notes'?'active':''}" onclick="renderNotesTab('${evId}')">📌 ملاحظات</button>
      </div>
    </div>`;

    if (tab === 'chat') {
      const msgsHtml = msgs.map(m => {
        const isMe = m.who === volName;
        const t = new Date(m.ts).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
        return `<div class="chat-msg ${isMe?'mine':'theirs'}">
          <div class="msg-meta">${isMe?'أنت':m.who} · ${t}</div>
          ${m.text}
        </div>`;
      }).join('') || '<div style="color:#475569;text-align:center;padding:20px;font-size:12px">لا توجد رسائل بعد، كن الأول! 👋</div>';

      inner += `<div class="chat-wrap">
        <div class="chat-messages" id="chatMsgsBox">${msgsHtml}</div>
        ${canEdit() ? `<div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="اكتب رسالة..." maxlength="300" onkeydown="if(event.key==='Enter')sendChatMsg('${evId}')"/>
          <button class="chat-send-btn" onclick="sendChatMsg('${evId}')">➤</button>
        </div>` : '<div style="padding:8px;text-align:center;font-size:11px;color:#475569">القراء لا يستطيعون إرسال رسائل</div>'}
      </div>`;
    }

    document.getElementById('volPanelContent').innerHTML = inner;
    document.getElementById('volPanelOverlay').classList.add('open');
    // Scroll chat to bottom
    setTimeout(()=>{const b=document.getElementById('chatMsgsBox');if(b)b.scrollTop=b.scrollHeight;},50);

    // Wire tab buttons
    const tabs = document.querySelectorAll('.tab-btn');
    if (tabs[0]) tabs[0].onclick = () => openEventChat(evId);
    if (tabs[1]) tabs[1].onclick = () => renderNotesTab(evId);
  }

  render('chat');
}

function renderNotesTab(evId) {
  currentChatEventId = evId;
  const ev = events[evId] || {};
  const notes = Object.values(eventNotes).filter(n=>n.eventId===evId).sort((a,b)=>b.ts-a.ts);

  const notesHtml = notes.map(n => {
    const t = new Date(n.ts).toLocaleDateString('ar-SA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const isMe = n.who === volName;
    return `<div class="note-item">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="note-author">${n.who}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="note-time">${t}</span>
          ${(isMe||isSupervisor)?`<button onclick="deleteNote('${n._id}')" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:11px">🗑️</button>`:''}
        </div>
      </div>
      <div class="note-text">${n.text}</div>
    </div>`;
  }).join('') || '<div style="color:#475569;text-align:center;padding:20px;font-size:12px">لا توجد ملاحظات بعد</div>';

  document.getElementById('volPanelContent').innerHTML = `
    <div class="panel2-header">
      <div class="panel2-title">💬 ${ev.name||''}</div>
      <button class="close-btn" onclick="closeVolPanel()">✕</button>
    </div>
    <div style="padding:10px 12px 0">
      <div class="tab-btns">
        <button class="tab-btn" onclick="openEventChat('${evId}')">💬 دردشة</button>
        <button class="tab-btn active">📌 ملاحظات</button>
      </div>
    </div>
    <div style="padding:0 12px 12px">
      ${canEdit() ? `<div style="display:flex;gap:6px;margin-bottom:10px">
        <input type="text" id="noteInput" placeholder="أضف ملاحظة على الفعالية..." maxlength="300" style="flex:1;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:7px 12px;font-family:'Tajawal',sans-serif;font-size:13px" onkeydown="if(event.key==='Enter')addNote('${evId}')"/>
        <button onclick="addNote('${evId}')" style="background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:12px">إضافة</button>
      </div>` : ''}
      ${notesHtml}
    </div>`;
  document.getElementById('volPanelOverlay').classList.add('open');
}

async function sendChatMsg(evId) {
  if (!canEdit()) return;
  const inp = document.getElementById('chatInput');
  const text = inp ? inp.value.trim() : '';
  if (!text || !volName) { toast('اكتب اسمك أولاً','#f59e0b'); return; }
  inp.value = '';
  await chatRef.push({ eventId:evId, who:volName, text, ts:Date.now() });
}

function renderChatMessages(evId) {
  const box = document.getElementById('chatMsgsBox');
  if (!box) return;
  const msgs = Object.values(chatMessages).filter(m=>m.eventId===evId).sort((a,b)=>a.ts-b.ts);
  box.innerHTML = msgs.map(m => {
    const isMe = m.who === volName;
    const t = new Date(m.ts).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
    return `<div class="chat-msg ${isMe?'mine':'theirs'}">
      <div class="msg-meta">${isMe?'أنت':m.who} · ${t}</div>
      ${m.text}
    </div>`;
  }).join('') || '<div style="color:#475569;text-align:center;padding:20px;font-size:12px">لا توجد رسائل بعد 👋</div>';
  box.scrollTop = box.scrollHeight;
}

async function addNote(evId) {
  if (!canEdit()) return;
  const inp = document.getElementById('noteInput');
  const text = inp ? inp.value.trim() : '';
  if (!text || !volName) { toast('اكتب اسمك أولاً','#f59e0b'); return; }
  inp.value = '';
  const ref = await notesRef.push({ eventId:evId, who:volName, text, ts:Date.now() });
  await notesRef.child(ref.key).update({ _id: ref.key });
  renderNotesTab(evId);
}

async function deleteNote(noteId) {
  if (!noteId) return;
  if (!confirm('حذف هذه الملاحظة؟')) return;
  await notesRef.child(noteId).remove();
  toast('🗑️ تم حذف الملاحظة','#f87171');
}

// ── ROLE MANAGEMENT ───────────────────────────────────────────────────
function openRoleManager(volId) {
  const v = volunteers[volId];
  if (!v || !isSupervisor) return;
  document.getElementById('volPanelContent').innerHTML = `
    <div class="panel2-header">
      <div class="panel2-title">🛡️ تغيير صلاحية ${v.name}</div>
      <button class="close-btn" onclick="closeVolPanel()">✕</button>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <button onclick="setVolRole('${volId}','volunteer')" style="font-family:'Tajawal',sans-serif;padding:12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;background:#22c55e22;color:#22c55e;border:1px solid #22c55e44">✅ متطوع — يضيف ويعدل</button>
      <button onclick="setVolRole('${volId}','reader')" style="font-family:'Tajawal',sans-serif;padding:12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;background:#60a5fa22;color:#60a5fa;border:1px solid #60a5fa44">👁️ قارئ — يشوف فقط</button>
    </div>`;
}

async function setVolRole(volId, role) {
  await volsRef.child(volId).update({ role });
  toast(`✅ تم تغيير الصلاحية إلى ${roleName(role)}`,'#22c55e');
  closeVolPanel();
  renderVolunteers();
}

function closeVolPanel() {
  document.getElementById('volPanelOverlay').classList.remove('open');
}

// Close vol panel on overlay click
document.getElementById('volPanelOverlay').addEventListener('click', function(e){
  if (e.target === this) closeVolPanel();
});

</script>

<!-- PANEL: Volunteer Profile/Register -->
<div class="panel-overlay2" id="volPanelOverlay">
  <div class="panel2" id="volPanelContent"></div>
</div>

</body>
</html>
